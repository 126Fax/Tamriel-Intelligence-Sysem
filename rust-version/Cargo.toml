[package]
name = "tamriel-intelligence"
version = "0.1.0"
edition = "2021"
description = "Independent Rust implementation of the Tamriel Intelligence System"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
bzip2 = "0.5"
quick-xml = "0.38"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tamriel-processing = { path = "../rust-engine" }

[dev-dependencies]
tempfile = "3"
