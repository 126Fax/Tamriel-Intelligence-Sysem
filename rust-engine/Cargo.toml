[package]
name = "tamriel-processing"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust processing engine for Tamriel Intelligence System"

[dependencies]
bzip2 = "0.5"
quick-xml = "0.38"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
